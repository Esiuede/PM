<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sheyla Cavalcanti</title>
  <link rel="stylesheet" href="style_full.css">
  <link rel="stylesheet" href="prothesys.css">
  <link rel="shortcut icon" type="image/x-icon" href="./imgs/minIcon.jpg">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand" aria-label="Sheyla Cavalcanti Laboratório de Prótese Dentária">
      <img src="./imgs/logo.jpg" alt="" class="login-logo">
      <div>
        <p class="eyebrow">Laboratório de Prótese Dentária</p>
        <h1>Sheyla Cavalcanti</h1>
        <p class="login-description">Gestão de recibos, agenda e financeiro em um só lugar.</p>
      </div>
    </section>

    <section class="login-card">
      <div class="login-card-header">
        <h2>Acessar sistema</h2>
        <p>Entre com o usuário cadastrado no Supabase.</p>
      </div>

      <form id="loginForm" class="login-form">
        <label for="login">E-mail</label>
        <input
          type="email"
          id="login"
          name="login"
          placeholder="seu@email.com"
          autocomplete="username"
          required
        >

        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button type="submit" class="primary-submit">Entrar</button>
        <p id="erro" class="form-message error" role="alert"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
