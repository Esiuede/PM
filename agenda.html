<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agenda - Sheyla Cavalcanti</title><link rel="stylesheet" href="style_full.css"><link rel="shortcut icon" type="image/x-icon" href="./imgs/minIcon.jpg"></head><body><div class="page-container">
<nav class="sidebar" aria-label="Navegação principal"><div class="sidebar-header"><div class="brand-title">Sheyla Cavalcanti</div><div class="brand-sub">Laboratório</div></div><ul class="nav-list"><li class="nav-item"><a href="menu.html" class="nav-link"><span class="nav-icon">📊</span>Dashboard</a></li><li class="nav-item"><a href="cadastro.html" class="nav-link"><span class="nav-icon">📋</span>Novo Recibo</a></li><li class="nav-item"><a href="recibos.html" class="nav-link"><span class="nav-icon">📂</span>Ver Recibos</a></li><li class="nav-item"><a href="agenda.html" class="nav-link active" aria-current="page"><span class="nav-icon">🗓️</span>Agenda</a></li><li class="nav-item"><a href="ContasAPagar.html" class="nav-link"><span class="nav-icon">💸</span>Contas a Pagar</a></li><li class="nav-item"><a href="ContasAReceber.html" class="nav-link"><span class="nav-icon">💰</span>Contas a Receber</a></li></ul></nav>
<main class="main-content"><div class="page-header"><div><p class="eyebrow">Compromissos</p><h1>Agenda da Semana</h1></div><button id="openModalBtn" class="action-btn primary-btn">+ Adicionar agendamento</button></div><section class="content-card agenda-card"><div class="calendar-nav"><button id="prevWeek" class="nav-btn" aria-label="Semana anterior">&lt;</button><div id="weekDates" aria-live="polite"></div><button id="nextWeek" class="nav-btn" aria-label="Próxima semana">&gt;</button></div><div class="agenda-legend"><span class="legend-item legend-prova">Prova</span><span class="legend-item legend-entrega">Entrega</span><span class="legend-item legend-moldagem">Moldagem</span><span class="legend-item legend-conserto">Conserto</span><span class="legend-item legend-domicilio">Domicílio</span></div><div id="kanban-board" aria-live="polite"></div></section></main></div>
<div id="addCardModal" class="modal" aria-hidden="true"><div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="agendaModalTitle"><button type="button" class="close-btn" aria-label="Fechar">&times;</button><h2 id="agendaModalTitle">Novo Agendamento</h2><form id="agendamentoForm" class="modal-form"><label for="nomeCliente">Nome do cliente</label><input type="text" id="nomeCliente" name="nomeCliente" maxlength="120" required><label for="tipoAtendimento">Tipo de atendimento</label><select id="tipoAtendimento" name="tipoAtendimento" required><option value="">Selecione</option><option value="Prova">Prova</option><option value="Entrega">Entrega</option><option value="Moldagem">Moldagem</option><option value="Conserto">Conserto</option><option value="Domicílio">Domicílio</option></select><label for="dataAtendimento">Data</label><input type="date" id="dataAtendimento" name="dataAtendimento" required><label for="horaAtendimento">Horário</label><input type="time" id="horaAtendimento" name="horaAtendimento" required><p id="agendaFormMessage" class="form-message" role="status"></p><button type="submit" class="primary-submit">Salvar</button></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="data-service.js"></script><script src="agenda.js"></script></body></html>
