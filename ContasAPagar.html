<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contas a Pagar - Sheyla Cavalcanti</title><link rel="stylesheet" href="style_full.css"><link rel="stylesheet" href="prothesys.css"><link rel="shortcut icon" type="image/x-icon" href="./imgs/minIcon.jpg"></head><body><div class="page-container">
<nav class="sidebar" aria-label="Navegação principal"><div class="sidebar-header"><div class="brand-title">Sheyla Cavalcanti</div><div class="brand-sub">Laboratório</div></div><ul class="nav-list"><li class="nav-item"><a href="menu.html" class="nav-link"><span class="nav-icon">📊</span>Dashboard</a></li><li class="nav-item"><a href="cadastro.html" class="nav-link"><span class="nav-icon">📋</span>Novo Recibo</a></li><li class="nav-item"><a href="recibos.html" class="nav-link"><span class="nav-icon">📂</span>Ver Recibos</a></li><li class="nav-item"><a href="agenda.html" class="nav-link"><span class="nav-icon">🗓️</span>Agenda</a></li><li class="nav-item"><a href="ContasAPagar.html" class="nav-link active" aria-current="page"><span class="nav-icon">💸</span>Contas a Pagar</a></li><li class="nav-item"><a href="ContasAReceber.html" class="nav-link"><span class="nav-icon">💰</span>Contas a Receber</a></li></ul></nav>
<main class="main-content"><div class="page-header"><div><p class="eyebrow">Financeiro</p><h1>Contas a Pagar</h1></div><button id="addContaBtn" class="action-btn primary-btn">+ Adicionar conta</button></div><section class="content-card"><p id="tableFeedback" class="inline-feedback" role="status"></p><div class="table-container"><table id="contasPagarTable"><thead><tr><th>Vencimento</th><th>Fornecedor</th><th>Valor</th><th>Categoria</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr><td colspan="6" class="table-empty">Carregando...</td></tr></tbody></table></div></section></main></div>
<div id="contaModal" class="modal" aria-hidden="true"><div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button type="button" class="close-btn" aria-label="Fechar">&times;</button><h2 id="modalTitle">Adicionar Nova Conta a Pagar</h2><form id="contaForm" class="modal-form"><input type="hidden" id="contaId" name="id"><label for="vencimento">Data de vencimento</label><input type="date" id="vencimento" name="vencimento" required><label for="fornecedor">Fornecedor</label><input type="text" id="fornecedor" name="fornecedor" maxlength="120" required><label for="valor">Valor</label><input type="text" id="valor" name="valor" placeholder="R$ 0,00" required><label for="descricao">Descrição</label><textarea id="descricao" name="descricao" rows="3" maxlength="500"></textarea><label for="categoria">Categoria</label><select id="categoria" name="categoria"><option value="Fornecedores">Fornecedores</option><option value="Aluguel">Aluguel</option><option value="Salário">Salário</option><option value="Impostos">Impostos</option><option value="Marketing">Marketing</option><option value="Outros">Outros</option></select><label for="formaPagamento">Forma de pagamento</label><select id="formaPagamento" name="formaPagamento"><option value="Boleto">Boleto</option><option value="Pix">Pix</option><option value="Cartão de Crédito">Cartão de Crédito</option><option value="Dinheiro">Dinheiro</option></select><label for="status">Status</label><select id="status" name="status"><option value="A pagar">A pagar</option><option value="Pago">Pago</option><option value="Vencida">Vencida</option></select><button type="submit" class="primary-submit">Salvar</button></form></div></div>
<script src="https://unpkg.com/imask"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="data-service.js"></script><script src="ContasAPagar.js"></script></body></html>
